name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test ./tools/reference-conformance.live.test.ts
      - run: bun test ./tools/route-switch.live.test.ts
        env:
          KRAKA_REQUIRED_ROUTE_CASES: "1"
      - run: bun test ./tools/codex-turn.live.test.ts
      - run: bun test ./tools/owner-pairing.live.test.ts
        env:
          KRAKA_REQUIRED_PAIRING_CASES: "1"
      - run: bun test ./tools/thread-resume.live.test.ts
      - run: bun test ./tools/first-send.live.test.ts
      - name: Test workspace and require all three short socket cases
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          bun test \
            --path-ignore-patterns "**/reference-conformance.live.test.ts" \
            --path-ignore-patterns "**/route-switch.live.test.ts" \
            --path-ignore-patterns "**/codex-turn.live.test.ts" \
            --path-ignore-patterns "**/owner-pairing.live.test.ts" \
            --path-ignore-patterns "**/thread-resume.live.test.ts" \
            --path-ignore-patterns "**/first-send.live.test.ts" 2>&1 | tee "$RUNNER_TEMP/flow-tests.log"
          for group in 1 2 3; do grep -F "(pass) $group. " "$RUNNER_TEMP/flow-tests.log"; done
      - run: bun run build
      - run: bun run protocol:reference:check
      - name: Measure control receipts on delayed and bandwidth-limited sockets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bun tools/stream-flow-bench.ts --shaped | tee "$RUNNER_TEMP/budget-shaped.jsonl"
          grep -Fx '{"group":4,"completed":true}' "$RUNNER_TEMP/budget-shaped.jsonl"
      - name: Measure budgets on the PR base
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$BASE_ROOT"' EXIT
          git archive "$BASE_SHA" | tar -xf - -C "$BASE_ROOT"
          (cd "$BASE_ROOT" && bun install --frozen-lockfile)
          bun run perf --baseline-root "$BASE_ROOT" | tee "$RUNNER_TEMP/budget-baseline.jsonl"
      - name: Measure candidate budgets
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          bun run perf --root . | tee "$RUNNER_TEMP/budget-candidate.jsonl"
      - name: Compare budget observations
        if: ${{ !cancelled() && runner.os == 'macOS' && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          bun tools/perf-compare.ts "$RUNNER_TEMP/budget-baseline.jsonl" "$RUNNER_TEMP/budget-candidate.jsonl" | tee "$RUNNER_TEMP/budget-comparison.jsonl"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: daemon-budget-reports
          path: |
            ${{ runner.temp }}/budget-*.jsonl
            ${{ runner.temp }}/flow-tests.log
          if-no-files-found: error
