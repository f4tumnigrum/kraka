name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run protocol:reference:check
      - name: Measure PR baseline
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$BASE_ROOT"' EXIT
          git archive "$BASE_SHA" | tar -xf - -C "$BASE_ROOT"
          (cd "$BASE_ROOT" && bun install --frozen-lockfile)
          bun tools/measure-replay.ts --baseline-root "$BASE_ROOT"
      - name: Measure replay startup and idle footprint
        if: runner.os == 'macOS'
        run: bun tools/measure-replay.ts --root .
