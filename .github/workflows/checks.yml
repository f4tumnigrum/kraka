name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    needs: installed
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - name: Require native launch evidence
        if: needs.installed.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Select the matching release
        id: native
        shell: bash
        run: |
          bun -e 'import {hostTarget,targetLabel} from "./tools/package-release"; console.log("target="+targetLabel(hostTarget()))' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: kraka-${{ steps.native.outputs.target }}
          path: .build/release
      - name: Use the downloaded archive for installed tests
        shell: bash
        run: |
          bun -e 'import {resolve} from "node:path"; const [path]=new Bun.Glob(".build/release/*.tar.gz").scanSync(); if(!path) throw Error("Missing release"); console.log("KRAKA_TEST_ARCHIVE="+resolve(path))' >> "$GITHUB_ENV"
      - name: Install the Chromium build for Playwright 1.56.1
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/kraka-chromium"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          bun run playwright install --with-deps chromium
          echo "KRAKA_BROWSER=chromium" >> "$GITHUB_ENV"
      - name: Verify four native browser cases
        shell: bash
        env:
          KRAKA_BROWSER_CASES: native
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          bun test tools/browser-https.live.test.ts 2>&1 | tee "$RUNNER_TEMP/browser-native.log"
          for group in 1 2 3 4; do grep -F "(pass) native $group. " "$RUNNER_TEMP/browser-native.log"; done
      - name: Verify four browser outbox cases
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 bun test tools/browser-outbox.live.test.ts 2>&1 | tee "$RUNNER_TEMP/browser-outbox.log"
          for group in 1 2 3 4; do grep -E "\(pass\).*outbox $group\. " "$RUNNER_TEMP/browser-outbox.log"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/browser-native.log
            ${{ runner.temp }}/browser-outbox.log
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test ./tools/reference-conformance.live.test.ts
      - run: bun test ./tools/route-switch.live.test.ts
        env:
          KRAKA_REQUIRED_ROUTE_CASES: "1"
      - run: bun test ./tools/input-recovery.live.test.ts
      - run: bun test ./tools/codex-turn.live.test.ts
      - name: Verify four Codex approval, stop and resume scenarios
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 bun test ./tools/codex-resume.live.test.ts 2>&1 | tee "$RUNNER_TEMP/codex-resume.log"
          for group in 1 2 3 4; do grep -F "(pass) $group. " "$RUNNER_TEMP/codex-resume.log"; done
      - name: Verify recorded tool activity and independent detail streams
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 bun test ./tools/tool-activity.live.test.ts 2>&1 | tee "$RUNNER_TEMP/tool-activity.log"
          for group in 1 2 3 4; do grep -F "(pass) $group. " "$RUNNER_TEMP/tool-activity.log"; done
      - run: bun test ./tools/owner-pairing.live.test.ts
        env:
          KRAKA_REQUIRED_PAIRING_CASES: "1"
      - name: Verify both devices and interrupted answer delivery
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 bun test ./tools/first-answer.live.test.ts 2>&1 | tee "$RUNNER_TEMP/first-answer.log"
          for group in 1 2 3; do grep -F "(pass) $group. " "$RUNNER_TEMP/first-answer.log"; done
      - name: Verify all three sealed attention list cases
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 bun test ./tools/thread-attention.live.test.ts 2>&1 | tee "$RUNNER_TEMP/thread-attention.log"
          for group in 1 2 3; do grep -F "(pass) $group. " "$RUNNER_TEMP/thread-attention.log"; done
      - run: bun test ./tools/thread-resume.live.test.ts
      - run: bun test ./tools/first-send.live.test.ts
      - name: Verify all four settings readback groups
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          bun test ./tools/settings-readback.live.test.ts 2>&1 | tee "$RUNNER_TEMP/settings-tests.log"
          for group in 1 2 3 4; do grep -F "(pass) S18.$group " "$RUNNER_TEMP/settings-tests.log"; done
      - run: bun test ./tools/isolated-start.live.test.ts
      - name: Verify all five local comparison cases
        env:
          NO_COLOR: "1"
        shell: bash
        run: |
          set -euo pipefail
          git --version
          bun test tools/local-diff.live.test.ts 2>&1 | tee "$RUNNER_TEMP/local-diff.log"
          for group in 1 2 3 4 5; do grep -F "(pass) $group. " "$RUNNER_TEMP/local-diff.log"; done
      - name: Verify all four round checkpoint cases
        env:
          NO_COLOR: "1"
        shell: bash
        run: |
          set -euo pipefail
          git --version
          bun test tools/round-patch.live.test.ts 2>&1 | tee "$RUNNER_TEMP/round-patch.log"
          for group in 1 2 3 4; do grep -F "(pass) $group. " "$RUNNER_TEMP/round-patch.log"; done
      - name: Test workspace and require all three short socket cases
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          bun test \
            --path-ignore-patterns "**/reference-conformance.live.test.ts" \
            --path-ignore-patterns "**/route-switch.live.test.ts" \
            --path-ignore-patterns "**/input-recovery.live.test.ts" \
            --path-ignore-patterns "**/codex-resume.live.test.ts" \
            --path-ignore-patterns "**/tool-activity.live.test.ts" \
            --path-ignore-patterns "**/codex-turn.live.test.ts" \
            --path-ignore-patterns "**/owner-pairing.live.test.ts" \
            --path-ignore-patterns "**/browser-outbox.live.test.ts" \
            --path-ignore-patterns "**/browser-https.live.test.ts" \
            --path-ignore-patterns "**/round-patch.live.test.ts" \
            --path-ignore-patterns "**/local-diff.live.test.ts" \
            --path-ignore-patterns "**/first-answer.live.test.ts" \
            --path-ignore-patterns "**/thread-attention.live.test.ts" \
            --path-ignore-patterns "**/thread-resume.live.test.ts" \
            --path-ignore-patterns "**/settings-readback.live.test.ts" \
            --path-ignore-patterns "**/isolated-start.live.test.ts" \
            --path-ignore-patterns "**/first-send.live.test.ts" 2>&1 | tee "$RUNNER_TEMP/flow-tests.log"
          for group in 1 2 3; do grep -F "(pass) $group. " "$RUNNER_TEMP/flow-tests.log"; done
      - run: bun run build
      - run: bun run protocol:reference:check
      - name: Verify content and control receipts on delayed and bandwidth-limited sockets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net bash -euo pipefail -c '
            ip link set lo up
            for shape in "delay 50ms" "rate 1mbit"; do
              read -r kind value <<< "$shape"
              tc qdisc replace dev lo root netem "$kind" "$value"
              echo "Checking loopback with $shape"
              sudo -u "$SUDO_USER" env NO_COLOR=1 "$1" test tools/stream-flow.live.test.ts \
                --test-name-pattern "$2" --timeout 180000 2>&1 | tee "$3/socket-$kind.log"
              grep -F "(pass) $2" "$3/socket-$kind.log"
            done
          ' -- "$(command -v bun)" "synthetic content traverses the real socket in both directions" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: macos-functional-logs
          path: |
            ${{ runner.temp }}/flow-tests.log
            ${{ runner.temp }}/first-answer.log
            ${{ runner.temp }}/codex-resume.log
            ${{ runner.temp }}/thread-attention.log
          if-no-files-found: error

  routed:
    env:
      KRAKA_BROWSER: chromium
      KRAKA_BROWSER_ROUTED: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-compose-action@v1
        with:
          version: v2.32.4
      - name: Verify six routed browser cases and path samples
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -p "kraka-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f tools/fixtures/browser-network.compose.yml)
          trap '"${compose[@]}" down --volumes --remove-orphans' EXIT
          "${compose[@]}" up -d --build --wait
          "${compose[@]}" exec -T -e KRAKA_BROWSER_CASES=routed -e NO_COLOR=1 desktop bun test tools/browser-https.live.test.ts 2>&1 | tee "$RUNNER_TEMP/browser-routed.log"
          for group in 1 2 3 4 5 6; do grep -F "(pass) routed $group. " "$RUNNER_TEMP/browser-routed.log"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-routed
          path: ${{ runner.temp }}/browser-routed.log

  release:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15, args: "--os darwin --arch arm64" }
          - { target: darwin-x64, runner: macos-15-intel, args: "--os darwin --arch x64" }
          - { target: win32-x64, runner: windows-2025, args: "--os win32 --arch x64" }
          - { target: win32-arm64, runner: windows-11-arm, args: "--os win32 --arch arm64" }
          - {
              target: linux-x64-glibc,
              runner: ubuntu-24.04,
              args: "--os linux --arch x64 --libc glibc",
            }
          - {
              target: linux-arm64-glibc,
              runner: ubuntu-24.04-arm,
              args: "--os linux --arch arm64 --libc glibc",
            }
          - {
              target: linux-x64-musl,
              runner: ubuntu-24.04,
              args: "--os linux --arch x64 --libc musl",
            }
          - {
              target: linux-arm64-musl,
              runner: ubuntu-24.04-arm,
              args: "--os linux --arch arm64 --libc musl",
            }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun tools/package-release.ts ${{ matrix.args }} --out .build/release
      - uses: actions/upload-artifact@v4
        with:
          name: kraka-${{ matrix.target }}
          path: .build/release/*
          if-no-files-found: error

  installed:
    name: Launch ${{ matrix.target }}
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: win32-x64, runner: windows-2025 }
          - { target: win32-arm64, runner: windows-11-arm }
          - { target: linux-x64-glibc, runner: ubuntu-24.04 }
          - { target: linux-arm64-glibc, runner: ubuntu-24.04-arm }
          - { target: linux-x64-musl, runner: ubuntu-24.04, alpine: true }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, alpine: true }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: kraka-${{ matrix.target }}
          path: .build/release
      - uses: oven-sh/setup-bun@v2
        if: ${{ !matrix.alpine }}
        with:
          bun-version: 1.4.5
      - if: ${{ !matrix.alpine }}
        run: bun install --frozen-lockfile
      - name: Launch on host
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          set -euo pipefail
          archive=(.build/release/*.tar.gz)
          NO_COLOR=1 KRAKA_TEST_ARCHIVE="${archive[0]}" bun test tools/installed-kraka.live.test.ts 2>&1 | tee .build/installed.log
      - name: Launch on musl
        if: matrix.alpine
        run: |
          set -eu
          docker run --rm -v "$PWD:/repo" -w /repo oven/bun:1.4.5-alpine sh -ec '
            apk add --no-cache git tar
            bun --version
            bun install --frozen-lockfile
            set -- .build/release/*.tar.gz
            NO_COLOR=1 KRAKA_TEST_ARCHIVE="$1" bun test tools/installed-kraka.live.test.ts > .build/installed.log 2>&1 || { cat .build/installed.log; exit 1; }
            cat .build/installed.log'
      - name: Require all three installed cases
        shell: bash
        run: |
          for n in 1 2 3; do grep -F "(pass) $n. " .build/installed.log || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.target }}
          path: .build/installed.log
          if-no-files-found: error

  desktop:
    name: Desktop launch ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64-glibc }
          - { os: macos-15, target: darwin-arm64 }
          - { os: windows-2025, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: kraka-${{ matrix.target }}
          path: .build/release
      - name: Download and verify pinned Electron
        run: bun tools/fixtures/ci-electron.ts
      - run: bun run --filter @kraka/desktop build
      - name: Verify installed window, IPC and CLI identity
        shell: bash
        env:
          KRAKA_DESKTOP_CASES: native
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          archive=(.build/release/*.tar.gz)
          export KRAKA_TEST_ARCHIVE="${archive[0]}"
          run=(bun test tools/desktop-handoff.live.test.ts)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            run=(xvfb-run -a "${run[@]}")
          fi
          "${run[@]}" 2>&1 | tee .build/desktop.log
          grep -F '(pass) installed desktop launches' .build/desktop.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-launch-${{ matrix.os }}
          path: .build/desktop.log

  desktop-handoff:
    name: Desktop handoff routed
    runs-on: ubuntu-24.04
    env:
      KRAKA_BROWSER: chromium
      KRAKA_BROWSER_ROUTED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-compose-action@v1
        with:
          version: v2.32.4
      - name: Build the installed desktop and verify its runtime
        shell: bash
        run: |
          run_id="kraka-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose -p "$run_id" -f tools/fixtures/browser-network.compose.yml build --build-arg KRAKA_INSTALL_DESKTOP=1 router
      - name: Verify four handoff cases on the private route
        shell: bash
        run: |
          set -euo pipefail
          run_id="kraka-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose -p "$run_id" -f tools/fixtures/browser-network.compose.yml -f tools/fixtures/desktop-network.compose.yml)
          trap '"${compose[@]}" down --volumes --remove-orphans' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          "${compose[@]}" up -d --wait
          "${compose[@]}" exec -T desktop chown pwuser /fixture/leaf.key /fixture/mobile.sock /fixture/cdp.sock
          "${compose[@]}" exec -T -u pwuser -e HOME=/home/pwuser -e KRAKA_DESKTOP_CASES=routed -e NO_COLOR=1 desktop xvfb-run -a bun test tools/desktop-handoff.live.test.ts 2>&1 | tee "$RUNNER_TEMP/desktop-handoff.log"
          for group in 1 2 3 4; do grep -F "(pass) routed installed desktop handoff > handoff $group." "$RUNNER_TEMP/desktop-handoff.log"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-handoff-routed
          path: ${{ runner.temp }}/desktop-handoff.log
