name: Time expired-cursor steps on Windows
on:
  push:
    branches: [fix/thread-resume-windows]
permissions:
  contents: read
jobs:
  timing:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Repeat the complete thread-resume file
        shell: pwsh
        run: |
          $failures = 0
          foreach ($trial in 1..6) {
            Write-Host "D009H trial $trial"
            $env:D009H_ACL = Join-Path $env:RUNNER_TEMP "acl-$trial.jsonl"
            bun test ./tools/thread-resume.live.test.ts
            if ($LASTEXITCODE -ne 0) { $failures++ }
            if (Test-Path $env:D009H_ACL) { Get-Content $env:D009H_ACL | ForEach-Object { Write-Host "D009H ACL $_" } }
          }
          exit $failures
